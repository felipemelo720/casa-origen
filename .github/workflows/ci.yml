name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Throwaway database for this run only. `/` is a static page that queries
    # Postgres at build time, so `next build` cannot succeed without one.
    # These credentials are not secrets: the container dies with the job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casaorigen
          POSTGRES_PASSWORD: casaorigen
          POSTGRES_DB: casaorigen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://casaorigen:casaorigen@localhost:5432/casaorigen?schema=public
      ADMIN_PASSWORD: ci-placeholder-password
      AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test

      # Integration tests own a second database in the same service container.
      # They TRUNCATE between tests, so they must never point at the database
      # `next build` seeds below — hence the `_test` suffix, which
      # `tests/setup/db.ts` refuses to run without.
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://casaorigen:casaorigen@localhost:5432/casaorigen_test?schema=public
        run: |
          PGPASSWORD=casaorigen psql -h localhost -U casaorigen -d casaorigen \
            -c 'CREATE DATABASE casaorigen_test'
          npm run test:int

      # Schema first, then catalogue data: the landing renders products,
      # settings and business hours during the build.
      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - run: npm run build

      # Telegram beats the failure email: the email lands in a folder nobody
      # opens on a phone. `if: failure()` also covers a job cancelled by a
      # previous step dying, which is the case that matters.
      # No-ops when TG_TOKEN is not set, so a fork does not fail here.
      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          curl --silent --output /dev/null --max-time 10 \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Casa Origen — CI falló en ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}). No se va a desplegar. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
